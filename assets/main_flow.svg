<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1000" height="760" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#172b4d">Application Flow</text><g font-family="Arial" font-size="16" text-anchor="middle"><rect x="390" y="65" width="220" height="48" rx="24" fill="#dcfce7" stroke="#15803d"/><text x="500" y="95" fill="#14532d">Start / Load inventory</text><path d="M500 113 V150" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="155" width="280" height="55" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="188" fill="#1e3a8a">Display menu and read choice</text><path d="M500 210 V250" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M500 250 L650 305 L500 360 L350 305 Z" fill="#ede9fe" stroke="#7c3aed"/><text x="500" y="310" fill="#4c1d95">Valid option?</text><path d="M350 305 H180 V400" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="245" y="292" fill="#b91c1c">No</text><rect x="80" y="405" width="200" height="58" rx="9" fill="#fee2e2" stroke="#dc2626"/><text x="180" y="440" fill="#991b1b">Show error message</text><path d="M180 463 V490 H320 V180 H350" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M500 360 V405" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="520" y="390" fill="#166534">Yes</text><rect x="355" y="410" width="290" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="438" fill="#1e3a8a">Run selected operation</text><text x="500" y="458" fill="#1e3a8a" font-size="13">Add / view / search / stock / sale / report</text><path d="M500 475 V515" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M500 515 L650 565 L500 615 L350 565 Z" fill="#ede9fe" stroke="#7c3aed"/><text x="500" y="570" fill="#4c1d95">Exit selected?</text><path d="M650 565 H800 V650" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="715" y="550" fill="#166534">Yes</text><rect x="700" y="655" width="200" height="55" rx="24" fill="#dcfce7" stroke="#15803d"/><text x="800" y="688" fill="#14532d">End</text><path d="M350 565 H320 V180 H350" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="260" y="550" fill="#1e3a8a">No: repeat menu</text></g></svg>