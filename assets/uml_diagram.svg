<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#fff"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#172b4d">Procedural Module Diagram</text><rect x="360" y="75" width="280" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="110" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">main.py</text><text x="500" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Constants • product list • sales list</text><g stroke="#64748b" stroke-width="2" fill="none"><path d="M500 165 V205 H180 V240 M500 205 H500 V240 M500 205 H820 V240"/><path d="M500 165 V400"/></g><g font-family="Arial" text-anchor="middle"><rect x="50" y="240" width="260" height="125" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="180" y="270" font-size="18" font-weight="bold" fill="#4c1d95">Product functions</text><text x="180" y="300" font-size="14" fill="#312e81">find_product()</text><text x="180" y="325" font-size="14" fill="#312e81">add_product()</text><text x="180" y="350" font-size="14" fill="#312e81">display_products()</text><rect x="370" y="240" width="260" height="125" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="500" y="270" font-size="18" font-weight="bold" fill="#14532d">Operations</text><text x="500" y="300" font-size="14" fill="#14532d">search_product()</text><text x="500" y="325" font-size="14" fill="#14532d">update_stock()</text><text x="500" y="350" font-size="14" fill="#14532d">process_sale()</text><rect x="690" y="240" width="260" height="125" rx="10" fill="#ffedd5" stroke="#d97706"/><text x="820" y="270" font-size="18" font-weight="bold" fill="#92400e">Reporting / UI</text><text x="820" y="300" font-size="14" fill="#78350f">view_sales()</text><text x="820" y="325" font-size="14" fill="#78350f">generate_report()</text><text x="820" y="350" font-size="1